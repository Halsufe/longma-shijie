[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["backend/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741", "F401", "F403", "F405", "F841"]
