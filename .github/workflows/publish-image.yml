name: Build and publish backend image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - backend/app/**
      - alembic/**
      - alembic.ini
      - .github/workflows/publish-image.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --label org.opencontainers.image.source=https://github.com/Halsufe/longma-shijie -t ghcr.io/halsufe/longma-shijie:${{ github.sha }} .
      - name: Test PostgreSQL migrations and startup
        env:
          DB_URL: postgresql://smoke:ephemeral-ci-only@127.0.0.1:5432/smoke
        run: |
          docker run --rm --network host -e DB_URL -e ENV=test ghcr.io/halsufe/longma-shijie:${{ github.sha }} alembic upgrade head
          docker run -d --name smoke-api --network host -e DB_URL -e ENV=test ghcr.io/halsufe/longma-shijie:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke-api
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        run: |
          docker tag ghcr.io/halsufe/longma-shijie:${{ github.sha }} ghcr.io/halsufe/longma-shijie:latest
          docker push ghcr.io/halsufe/longma-shijie:${{ github.sha }}
          docker push ghcr.io/halsufe/longma-shijie:latest
