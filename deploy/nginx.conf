# 龙马·视界 Nginx 反代配置
# 注意：本配置为产物，未在本环境运行时验证。
# 关键：SSE 流式对话需 proxy_buffering off + 长超时

upstream longma_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;  # 知识库文件上传

    # API 与前端
    location / {
        proxy_pass http://longma_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持：关闭缓冲、延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location /health {
        proxy_pass http://longma_app/health;
        access_log off;
    }
}
